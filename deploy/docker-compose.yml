# Local PostgreSQL + TG Sales CRM with Docker (optional; the Windows app uses
# launch.bat and a bundled PostgreSQL instead).
#
#   copy deploy\.env.example deploy\.env   (then set the passwords)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   open http://127.0.0.1:8765
#
# Both services are published on 127.0.0.1 only: nothing is reachable from
# other computers. Do not change that before sign-in and HTTPS exist.
name: tg-sales

services:
  db:
    image: postgres:18.4-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: tg_sales
      POSTGRES_USER: tg_sales
      POSTGRES_PASSWORD: ${TG_SALES_DB_PASSWORD:?set TG_SALES_DB_PASSWORD in deploy/.env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${TG_SALES_DB_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_sales -d tg_sales"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TG_SALES_DATABASE_URL: postgresql://tg_sales:${TG_SALES_DB_PASSWORD}@db:5432/tg_sales
      TG_SALES_ENVIRONMENT: production
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:${TG_SALES_PORT:-8765}:8765"

volumes:
  pgdata:
  appdata:
